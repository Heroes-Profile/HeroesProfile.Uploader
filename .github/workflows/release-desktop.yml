name: Release (Desktop)

# Builds the cross-platform Desktop app for every OS with Velopack (`vpk pack`) and uploads it all as
# one GitHub release: Windows installer, macOS .pkg/.app (Apple Silicon and Intel), Linux AppImage,
# plus a Linux tarball for headless/systemd use. Installed copies update themselves from these
# releases (Heroesprofile.Uploader.Desktop/Updates/AppUpdater.cs).
#
# Runs by hand (Run workflow), and on every code push to the working branch (see `push` below). Either
# way it's a DRAFT unless you choose "prerelease" when running it by hand: drafts are invisible to update
# clients, so a build only reaches testers once you publish it (or choose "prerelease").
#
# Signing: each OS signs only once its account is set up in the repo's "release-signing" environment
# (each value is listed below); until then that OS's build is unsigned, exactly as before.
#   Windows - Azure Artifact Signing (vars AZURE_CLIENT_ID, AZURE_TENANT_ID, ARTIFACT_SIGNING_ENDPOINT,
#             ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE)
#   macOS   - Developer ID + notarization (var APPLE_TEAM_ID; secrets MACOS_CERTIFICATES_P12,
#             MACOS_CERTIFICATES_PASSWORD, APPLE_API_KEY_P8; vars APPLE_API_KEY_ID, APPLE_API_ISSUER)
#   Linux   - GPG-signed SHA256SUMS (secrets LINUX_GPG_PRIVATE_KEY, LINUX_GPG_PASSPHRASE)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 3.0.0-beta.3. Empty: HeroesProfileVersion (Directory.Build.props) + "-beta.<run number>"'
        required: false
        default: ''
      release:
        description: >-
          draft: only maintainers can see it. prerelease: testers get it (installed copies with beta
          updates on update to it). Note the Windows output also carries a Squirrel-format RELEASES file,
          so old WPF installs with "Allow beta updates" on could be offered a prerelease too.
        required: true
        default: draft
        type: choice
        options: [draft, prerelease]
  # TEMPORARY - remove before merging to master. Every push to the working branch that changes the
  # app (not just docs, tests or other workflows) builds a fresh beta DRAFT, replacing the previous one
  # (a push has no inputs, so `release` is empty = draft). Publish it on GitHub when it's good to go.
  # It also lets the workflow run at all before it's on master: GitHub only offers "Run workflow" for
  # workflows that exist on the default branch.
  push:
    branches: [OSAgnosticUpdate]
    paths-ignore:
      - '**/*.md'
      - 'Heroesprofile.Uploader.Tests/**'
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
      - '.editorconfig'
      - 'LICENSE'

# One release build at a time: a push while one is running waits for it (never cancels it - a build
# stopped halfway through uploading would leave a half-filled draft), and only the newest waiting run
# is kept.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Velopack app id - installs and updates key on it, so never change it. Windows installs go to
  # %LOCALAPPDATA%\Heroesprofile.Uploader, next to (not over) the old WPF app's %LOCALAPPDATA%\Heroesprofile.
  PACK_ID: Heroesprofile.Uploader
  PACK_TITLE: Heroes Profile Uploader
  # The legal entity every signature is issued to.
  PUBLISHER: Skill Tree Development LLC
  MAIN_EXE: heroesprofile-uploader

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            version="${REQUESTED#v}"
          else
            base=$(sed -nE 's/.*<HeroesProfileVersion>([0-9]+\.[0-9]+\.[0-9]+)<\/HeroesProfileVersion>.*/\1/p' Directory.Build.props)
            [ -n "$base" ] || { echo "No three-part HeroesProfileVersion in Directory.Build.props" >&2; exit 1; }
            version="$base-beta.${{ github.run_number }}"
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            channel: win
          # The "Ranks" build: the same Windows app plus the opt-in rank reader
          # (Heroesprofile.Uploader.RankCapture), on its own update channel so a normal install is never
          # moved onto it. Only this entry sets publish-args.
          - os: windows-latest
            rid: win-x64
            channel: win-ranks
            publish-args: -p:IncludeRankCapture=true
          - os: ubuntu-latest
            rid: linux-x64
            channel: linux
          - os: macos-latest
            rid: osx-arm64
            channel: osx-arm64
          - os: macos-latest
            rid: osx-x64
            channel: osx-x64
    runs-on: ${{ matrix.os }}
    # Holds the signing credentials; restrict it to trusted branches/tags (and add reviewers) in the
    # repo's Settings -> Environments.
    environment: release-signing
    permissions:
      contents: read
      id-token: write # Azure sign-in without a stored secret (OIDC)
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGN_WINDOWS: ${{ startsWith(matrix.rid, 'win-') && vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
      SIGN_MACOS: ${{ startsWith(matrix.rid, 'osx-') && vars.APPLE_TEAM_ID != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore vpk
        run: dotnet tool restore

      # A RID-specific publish restores a different graph than the lock files describe (runtime packs),
      # so locked mode is off here; versions still come from Directory.Packages.props.
      - name: Publish
        run: >
          dotnet publish Heroesprofile.Uploader.Desktop -c Release -r ${{ matrix.rid }} --self-contained
          -p:Version=$VERSION -p:DebugType=none -p:RestoreLockedMode=false ${{ matrix.publish-args }} -o publish

      # The normal builds must never carry the rank reader's screen-capture code (it's what lets
      # privacy-minded users pick them); the Ranks build must.
      - name: Check the rank reader is only in the Ranks build
        run: |
          found=$(find publish -iname '*RankCapture*' | head -1)
          if [ "${{ matrix.channel }}" = "win-ranks" ]; then
            [ -n "$found" ] || { echo "::error::The Ranks build is missing Heroesprofile.Uploader.RankCapture"; exit 1; }
          else
            [ -z "$found" ] || { echo "::error::$found is in the ${{ matrix.channel }} build - rank capture must only ship in the Ranks build"; exit 1; }
          fi

      - name: Icon
        id: icon
        run: |
          case "${{ matrix.rid }}" in
            win-*)   echo "path=Heroesprofile.Uploader.Desktop/Gui/Assets/app-icon.ico" >> "$GITHUB_OUTPUT" ;;
            linux-*) echo "path=Heroesprofile.Uploader.Desktop/Gui/Assets/icons/256.png" >> "$GITHUB_OUTPUT" ;;
            osx-*)
              # macOS wants an .icns; the iconset's sizes are each rendered from the vector logo.
              iconutil -c icns packaging/macos/AppIcon.iconset -o app.icns
              echo "path=app.icns" >> "$GITHUB_OUTPUT" ;;
          esac

      # The previous release's packages let vpk build a small delta update instead of a full one.
      - name: Fetch the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}"
          --channel ${{ matrix.channel }} --pre --token "$GH_TOKEN" -o releases
          || echo "No previous release for ${{ matrix.channel }} - full package only."

      # --- Windows signing: Azure Artifact Signing, signed in with OIDC (no stored secret). ---
      - name: Azure sign-in
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The app only has a role on the signing account, not the subscription - which is all signing needs.
          allow-no-subscriptions: true

      - name: Windows signing settings
        if: env.SIGN_WINDOWS == 'true'
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          jq -n --arg e "$ENDPOINT" --arg a "$ACCOUNT" --arg p "$PROFILE" \
            '{Endpoint: $e, CodeSigningAccountName: $a, CertificateProfileName: $p}' > "$RUNNER_TEMP/signing.json"

      # --- macOS signing: Developer ID certificates in a throwaway keychain, notarized with an App
      # Store Connect API key. The keychain and key file are deleted at the end of the job. ---
      - name: macOS signing keychain
        if: env.SIGN_MACOS == 'true'
        env:
          CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          xcrun notarytool store-credentials heroesprofile-notary --key "$RUNNER_TEMP/api-key.p8" \
            --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --keychain "$keychain"
          rm "$RUNNER_TEMP/api-key.p8"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Pack
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          args=(--packId "$PACK_ID" --packVersion "$VERSION" --packTitle "$PACK_TITLE" --packAuthors "Heroes Profile"
                --packDir publish --runtime ${{ matrix.rid }} --icon "${{ steps.icon.outputs.path }}" -o releases)
          case "${{ matrix.rid }}" in
            # The normal Windows build stays on vpk's default channel ("win"); the Ranks build has its own.
            # The install/update window shows packaging/splash.png (heroesprofile.com's look: its logo,
            # near-black, Ruslan Display) with a progress bar in the site's light teal.
            win-*) args+=(--mainExe "$MAIN_EXE.exe" --splashImage packaging/splash.png --splashProgressColor "#00d5d5")
                   if [ "${{ matrix.channel }}" != "win" ]; then args+=(--channel ${{ matrix.channel }}); fi ;;
            osx-*) args+=(--mainExe "$MAIN_EXE" --channel ${{ matrix.channel }} --bundleId com.heroesprofile.uploader) ;;
            *)     args+=(--mainExe "$MAIN_EXE" --channel ${{ matrix.channel }}) ;;
          esac
          # Signs the app, Setup.exe/Update.exe (Windows) or the .app and .pkg (macOS, then notarizes
          # and staples them) - every file users download and every update package.
          if [ "$SIGN_WINDOWS" = "true" ]; then
            args+=(--azureTrustedSignFile "$RUNNER_TEMP/signing.json")
          fi
          if [ "$SIGN_MACOS" = "true" ]; then
            args+=(--signAppIdentity "Developer ID Application: $PUBLISHER ($TEAM_ID)"
                   --signInstallIdentity "Developer ID Installer: $PUBLISHER ($TEAM_ID)"
                   --signEntitlements packaging/macos/entitlements.plist
                   --notaryProfile heroesprofile-notary --keychain "$KEYCHAIN")
          fi
          dotnet vpk pack "${args[@]}"
          ls -la releases

      # A release that claims to be signed must really be: fail the build otherwise.
      - name: Verify Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $failed = $false
          New-Item -ItemType Directory -Force check | Out-Null
          Expand-Archive (Get-ChildItem releases/*-Portable.zip | Select-Object -First 1) check -Force
          # Ours only - the runtime's own .exe files (createdump.exe) stay signed by Microsoft.
          $files = @(Get-ChildItem releases/*-Setup.exe) + @(Get-ChildItem check/*.exe) +
                   @(Get-ChildItem check -Recurse -Include "$env:MAIN_EXE.exe", Update.exe)
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} - {2} - timestamped: {3}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject, ($null -ne $s.TimeStamperCertificate)
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notlike "*$env:PUBLISHER*" -or $null -eq $s.TimeStamperCertificate) { $failed = $true }
          }
          if ($failed) { throw "Some files aren't validly signed and timestamped by $env:PUBLISHER" }

      - name: Verify macOS signatures
        if: env.SIGN_MACOS == 'true'
        run: |
          mkdir -p check && ditto -x -k releases/*-Portable.zip check
          app=$(find check -maxdepth 2 -name "*.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          assessment=$(spctl --assess --type execute -vv "$app" 2>&1)
          echo "$assessment"
          grep -q "source=Notarized Developer ID" <<< "$assessment"
          xcrun stapler validate "$app"
          pkg=$(ls releases/*-Setup.pkg | head -1)
          signature=$(pkgutil --check-signature "$pkg")
          echo "$signature"
          grep -q "$PUBLISHER" <<< "$signature"
          spctl --assess --type install -vv "$pkg"

      - name: Remove the signing keychain
        if: always() && env.SIGN_MACOS == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # Headless/systemd Linux users run the plain single-file binary (packaging/linux/README.md).
      - name: Linux tarball
        if: startsWith(matrix.rid, 'linux-')
        run: |
          dotnet publish Heroesprofile.Uploader.Desktop -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:Version=$VERSION -p:DebugType=none -p:RestoreLockedMode=false -o single
          mkdir -p dist/HeroesProfileUploader extra
          cp single/$MAIN_EXE packaging/linux/README.md packaging/linux/heroesprofile-uploader.service dist/HeroesProfileUploader/
          tar -czf extra/HeroesProfileUploader-linux-x64.tar.gz -C dist HeroesProfileUploader

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.channel }}
          path: |
            releases
            extra
          retention-days: 14

  upload:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGN_LINUX: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore vpk
        run: dotnet tool restore

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*

      # One job uploads everything, one channel at a time into the same release (--merge), so the
      # per-OS builds never race each other to create it.
      - name: Upload to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release || 'draft' }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          # One draft at a time: remove earlier beta drafts (tag vX.Y.Z-beta.N) before uploading this
          # build. Only drafts - published releases (prereleases included) are never touched, and drafts
          # have no git tag yet.
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft and (.tagName | startswith("v")) and (.tagName | contains("-beta."))) | .tagName' |
          while read -r draft; do
            echo "Removing earlier draft $draft"
            gh release delete "$draft" --yes
          done

          # Named like every earlier release: just the tag, e.g. v3.0.0-beta.2.
          flags=(--merge --tag "v$VERSION" --releaseName "v$VERSION")
          for channel in win win-ranks linux osx-arm64 osx-x64; do
            dotnet vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" \
              --channel "$channel" -o "release-$channel/releases" "${flags[@]}"
          done
          # SHA256SUMS lets Linux installs of the earlier, PR #53 build find this release: that build's own
          # updater only takes releases with one, and verifies the AppImage/tarball against it before
          # swapping it in - which moves those users onto the Velopack AppImage.
          cp release-linux/extra/HeroesProfileUploader-linux-x64.tar.gz .
          cp release-linux/releases/*.AppImage .
          sha256sum *.AppImage HeroesProfileUploader-linux-x64.tar.gz > SHA256SUMS
          cat SHA256SUMS
          extra=()
          if [ "$SIGN_LINUX" = "true" ]; then
            # Detached signature with the project's release key (published with its fingerprint), so
            # anyone can check the Linux downloads: gpg --verify SHA256SUMS.asc && sha256sum -c SHA256SUMS
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -m 700 "$GNUPGHOME"
            echo "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
            echo "$LINUX_GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign -o SHA256SUMS.asc SHA256SUMS
            gpg --verify SHA256SUMS.asc SHA256SUMS
            rm -rf "$GNUPGHOME"
            extra+=(SHA256SUMS.asc)
          fi
          # The website links to .../releases/latest/download/HeroesProfileUploaderSetup.exe (the WPF
          # app's installer name); a copy under that name keeps those links working.
          cp release-win/releases/*-win-Setup.exe HeroesProfileUploaderSetup.exe
          gh release upload "v$VERSION" HeroesProfileUploader-linux-x64.tar.gz SHA256SUMS HeroesProfileUploaderSetup.exe "${extra[@]}" --clobber
          # The release description: which of all these files to download on which OS.
          sed "s|INSTALL_URL|https://github.com/${{ github.repository }}/blob/${{ github.sha }}/packaging/INSTALL.md|"             packaging/release-notes.md > release-notes.md
          # Pin the tag to the commit this was built from: a draft has no tag yet, and without a target
          # publishing it would tag the default branch (master) instead.
          gh release edit "v$VERSION" --notes-file release-notes.md --target "${{ github.sha }}"
          # Everything goes up as a draft first (above), so a prerelease is only published - and its tag
          # created, at that commit - once all its files and notes are in place.
          if [ "$RELEASE" = "prerelease" ]; then
            gh release edit "v$VERSION" --draft=false --prerelease --latest=false
          fi

      - name: Summary
        env:
          RELEASE: ${{ inputs.release || 'draft' }}
        run: |
          {
            echo "## v$VERSION ($RELEASE)"
            echo
            echo "Signed: Windows ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' && 'yes' || 'no' }}, macOS ${{ vars.APPLE_TEAM_ID != '' && 'yes' || 'no' }}, Linux checksums $SIGN_LINUX"
            echo
            echo "Release: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
            echo
            echo "Install instructions for testers: packaging/INSTALL.md"
          } >> "$GITHUB_STEP_SUMMARY"
